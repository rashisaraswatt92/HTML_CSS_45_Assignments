<header><h1>Job Application</h1></header><main><form><label>Full name <input name="name" required></label><label>Email <input type="email" name="email" required></label><label>Phone <input type="tel" name="phone"></label><label>Portfolio URL <input type="url" name="portfolio"></label><label>Years of experience <input type="number" min="0" max="50"></label><label>Available from <input type="date"></label><label>Preferred interview time <input type="time"></label><label>Upload resume <input type="file"></label><label><input type="checkbox"> I confirm the information is correct.</label><label>Work type <select><option>Full time</option><option>Part time</option><option>Internship</option></select></label><label>Short note <textarea rows="3"></textarea></label><button>Submit application</button><button type="reset">Reset</button></form></main>
</body>
